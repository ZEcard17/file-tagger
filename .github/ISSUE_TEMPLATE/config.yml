# ★ 提 issue 之前，请先看一眼这里

**★ 谢谢你想帮忙！** 但**有些问题不用开 issue** —— 先看看能不能自己解决。

---

## ★ 1. 程序打不开 / 闪一下就没了

**★ 先试这几个**（按顺序）：

| 试什么 | 怎么做 |
|---|---|
| **等几秒** | ★ 打包成 exe 后**第一次启动会慢 3~8 秒**（要先解压）|
| **看杀毒软件** | ★★ exe 容易被误报。看**隔离区**里有没有 —— 有就先加白名单 |
| **用源码跑** | `python AIxiede.py` —— **能看到报错信息**（exe 看不到）|
| **删掉设置文件** | 把 `%USERPROFILE%\.file_tagger_settings.json` 改名，重开 |

**★ 如果还不行** → 开 issue，**把报错信息贴上来**。

---

## ★ 2. 某个文件/文件夹打不开、列表是空的

**★ 常见原因**：

| 现象 | 可能的原因 |
|---|---|
| **网盘目录列表空/转圈** | 网盘客户端**没运行**或**没登录**（★ 先去看 CloudDrive2 开着没）|
| **网盘时好时坏** | ★ 网盘挂载名会变（`\\CloudDrive\X` ↔ `\\CloudDrive\百度网盘`）——程序有"修复路径"功能，见「诊断」菜单 |
| **大目录很慢** | 正常（★ 几万文件要几秒）。可以给目录**建索引**（「索引管理」）|
| **权限不够** | 系统目录（比如 `C:\Windows`）本来就读不了 —— 正常 |

---

## ★ 3. 界面文字看不清 / 颜色很怪

**★ 先试**：
- 「设置 → 🎨 皮肤」→ **切白天/夜间**看看
- 「设置 → 🖥 调整界面缩放」→ **改缩放**（高 DPI 屏幕常需要）

**★ 如果是深色模式下"有些字还是黑的"** → **这是已知问题**，欢迎开 issue 说清**在哪个位置**。

---

## ★ 4. 我想加个功能

**★ 先看这两个地方**：
- `文档/待清算清单.md` —— **作者已经记下来想做的**
- 搜一下**已有的 issue**（可能别人提过了）

**★ 都翻过了还是没有** → 开 issue，**★ 记得说"你要解决什么问题"**（见模板）。

---

## ★ 5. 我想补翻译 / 加语言

**★★ 这个不用开 issue —— 直接提 PR 更快！**

见 [`CONTRIBUTING.md`](../CONTRIBUTING.md) 的"补翻译"那一节。

---

## ★ 6. 数据会不会被上传

**★ 不会。** 所有数据（文件路径、标签、索引）**都在你自己的电脑上**。

**★ 唯一的联网功能**是 **CloudDrive2 集成** ——
它连的是**你自己电脑上的网盘客户端**（`localhost:19798`），**不经过任何服务器**。

**★ 详见 [`README.md`](../README.md) 的"数据存在哪儿"。**

---

## ★ 7. 怎么知道"程序偷偷干了什么"

**★ 程序里有三处能看到**：
- **「输出」面板** —— 它干了什么
- **「🔔 问题」面板** —— 哪里出了错（★ 包括"被吞掉"的错误）
- **使用日志** —— 在数据目录里的 `.file_tagger_usage.jsonl`

**★ 完全是本地的，不会发送到任何地方。**

---

## ★ 8. 我遇到了一个"很奇怪"的 bug

**★ 这类最有价值，也最需要信息**。请尽量提供：

- ☐ **能不能稳定复现**？（每次都这样 / 偶尔）
- ☐ **你试过什么**？（换目录/重启/换皮肤…结果如何）
- ☐ **「🔔 问题」面板里有什么**？（★ 尤其 `[已跳过]` 开头的）
- ☐ **有没有截图**？（★ 直接拖进 issue 就行）

**★★ 「🔔 问题」面板里的东西**特别重要 ——
那里面记的是"**被程序吞掉的错误**"，
**很多时候只是"某个小功能没生效"，但它往往是真正问题的线索。**

